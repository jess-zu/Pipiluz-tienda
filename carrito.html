<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrito – Pipiluz</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    .carrito-wrap { display:grid; grid-template-columns:2fr 1fr; gap:2rem; align-items:start; }
    .carrito-items { background:var(--blanco); border-radius:var(--radio); box-shadow:var(--sombra); overflow:hidden; }
    .carrito-item  { display:flex; align-items:center; gap:1rem; padding:1.2rem 1.5rem; border-bottom:1px solid #F0EBF8; }
    .carrito-item__emoji { font-size:2.5rem; }
    .carrito-item__info  { flex:1; }
    .carrito-item__name  { font-weight:700; }
    .carrito-item__price { color:var(--naranja); font-weight:800; }
    .qty-control { display:flex; align-items:center; gap:.5rem; }
    .qty-btn { width:28px;height:28px;border-radius:50%;border:2px solid var(--naranja);background:none;
               color:var(--naranja);font-size:1rem;font-weight:800;cursor:pointer;transition:all var(--trans); }
    .qty-btn:hover { background:var(--naranja);color:#fff; }
    .resumen { background:var(--blanco); border-radius:var(--radio); box-shadow:var(--sombra); padding:1.5rem; position:sticky;top:90px; }
    .resumen h3 { font-family:'Baloo 2',cursive;font-size:1.3rem;font-weight:800;margin-bottom:1rem; }
    .resumen-row { display:flex;justify-content:space-between;margin-bottom:.6rem;font-size:.95rem; }
    .resumen-total { font-weight:800;font-size:1.15rem;border-top:2px solid #F0EBF8;padding-top:.8rem;margin-top:.8rem; }
    .carrito-vacio { text-align:center;padding:4rem 2rem;color:var(--texto-soft); }
    .carrito-vacio .big { font-size:5rem;margin-bottom:1rem; }
    @media(max-width:700px){ .carrito-wrap{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <header class="header">
    <div class="header__inner container">
      <a href="index.html" class="logo"><span class="logo__icon">🌟</span><span class="logo__text">pipiluz</span></a>
      <nav class="nav" id="nav">
        <ul class="nav__list">
          <li><a href="index.html" class="nav__link">Inicio</a></li>
          <li><a href="tienda.html" class="nav__link">Tienda</a></li>
          <li><a href="nosotros.html" class="nav__link">Nosotros</a></li>
          <li><a href="contacto.html" class="nav__link">Contacto</a></li>
        </ul>
      </nav>
      <div class="header__actions">
        <a href="carrito.html" class="btn-icon">🛒 <span class="cart-badge" id="cartBadge">0</span></a>
        <button class="hamburger" id="hamburger">☰</button>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <h1 style="font-family:'Baloo 2',cursive;font-size:2rem;font-weight:800;margin-bottom:2rem">🛒 Mi carrito</h1>
      <div id="carritoContenido"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer__bottom"><p>© 2025 Pipiluz. Todos los derechos reservados.</p></div>
  </footer>

  <script src="js/main.js"></script>
  <!-- Botón flotante WhatsApp -->

     class="whatsapp-float"
     target="_blank"

     aria-label="Contactar por WhatsApp">

</body>
</html>
